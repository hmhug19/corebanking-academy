services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: core_academy
      POSTGRES_USER: core_academy
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - core_academy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_academy -d core_academy"]
      interval: 5s
      retries: 10
volumes:
  core_academy_pg:
