<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bài giảng SCORM</title>
  <style>
    html,body{height:100%;margin:0;font:14px system-ui,sans-serif}
    body{display:grid;grid-template-rows:minmax(0,1fr);background:#fff;color:#172b2b}
    body.has-status{grid-template-rows:auto minmax(0,1fr)}
    #status{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#f4f7f7}
    #statusText{flex:1}iframe{width:100%;height:100%;border:0}button{font:inherit;padding:4px 12px;cursor:pointer}
    [hidden]{display:none!important}
  </style>
  <script>window.SCORM_BOOTSTRAP=__BOOTSTRAP__;</script>
  <script src="runtime.js"></script>
</head>
<body class="has-status">
  <div id="status" role="status"><span id="statusText">Đang mở bài giảng…</span><button id="retry" hidden>Thử lưu lại</button></div>
  <iframe id="content" title="Nội dung bài giảng SCORM" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
</body>
</html>
