server:
  port: ${SERVER_PORT:8019}
  error:
    include-message: never
spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: corebanking-academy
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
  servlet:
    multipart:
      location: ${UPLOAD_TEMP_DIR:${java.io.tmpdir}}
      max-file-size: 500MB
      max-request-size: 501MB
  ai:
    mcp:
      server:
        # Trợ lý ngoài (ADR 0004): /api/v1/mcp, stateless Streamable HTTP. The connection token filter answers 404
        # while app.assistant.external.enabled is off. Only the five tools and one prompt of ExternalMcpConfig are
        # served: no Spring AI tool callbacks, annotation scanning, resources or completions.
        protocol: STATELESS
        type: SYNC
        name: chan-academy
        version: 1.0.0
        tool-callback-converter: false
        annotation-scanner:
          enabled: false
        capabilities:
          resource: false
          completion: false
        streamable-http:
          mcp-endpoint: /api/v1/mcp
        instructions: >-
          You draft a CHAN Academy course for the signed-in author from a document the author gave you in this chat.
          The server never sees that document and you cannot read anything stored in CHAN Academy. Work one step at a
          time: start_course_drafting, give the author the editor link, then propose_step for the step that waits
          (1 basics, 2 outline, 3 rules and questions, 4 audience). After each step tell the author to open the link,
          edit the fields and press "Chốt bước", then wait until the author says "tiếp"; call get_drafting_session to
          read what the author confirmed before the next step. Never write lesson content. Never say a course was
          created, published, assigned or shared: only the author does that, on the page.
  mvc:
    async:
      # A streamed answer (agent or document chat) may make max-steps model calls, each up to the Ollama read-timeout.
      request-timeout: ${ASSISTANT_STREAM_TIMEOUT:15m}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  storage:
    temp-dir: ${UPLOAD_TEMP_DIR:${java.io.tmpdir}}
    s3:
      endpoint: ${S3_ENDPOINT}
      bucket: ${S3_BUCKET:academy-media}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      connect-timeout-seconds: ${S3_CONNECT_TIMEOUT_SECONDS:5}
      read-timeout-seconds: ${S3_READ_TIMEOUT_SECONDS:60}
      call-timeout-seconds: ${S3_CALL_TIMEOUT_SECONDS:600}
  learning:
    # SCORM packages execute on a separate origin/connector, never on the LMS origin.
    course-index:
      # How often the worker looks for published course revisions that are not indexed yet.
      poll-interval: ${COURSE_INDEX_POLL:30s}
      # A revision that fails to index is tried again after retry-delay (doubling each time) until max-attempts
      # attempts have failed; then it shows as failed and waits for an admin.
      max-attempts: ${COURSE_INDEX_MAX_ATTEMPTS:5}
      retry-delay: ${COURSE_INDEX_RETRY_DELAY:2m}
    points:
      # Weights of the learning leaderboard; override with APP_LEARNING_POINTS_LESSON and so on.
      lesson: 5
      quiz-pass: 30
  knowledge:
    storage-dir: ${KNOWLEDGE_STORAGE_DIR:./data/knowledge}
    max-file-size: ${KNOWLEDGE_MAX_FILE_SIZE:20MB}
    worker:
      poll-interval: ${KNOWLEDGE_WORKER_POLL:2s}
      concurrency: ${KNOWLEDGE_WORKER_CONCURRENCY:1}
      max-attempts: 3
    extraction:
      max-pages: ${KNOWLEDGE_EXTRACTION_MAX_PAGES:300}
      max-characters: ${KNOWLEDGE_EXTRACTION_MAX_CHARACTERS:1500000}
      max-duration: ${KNOWLEDGE_EXTRACTION_MAX_DURATION:60s}
      min-readable-word-share: ${KNOWLEDGE_EXTRACTION_MIN_READABLE_WORD_SHARE:0.5}
    chunk:
      # Chunker v2 (rag-quality ticket 04). Raise version after changing the chunker, then run the re-index.
      version: 2
      target-tokens: 400
      max-tokens: 550
      overlap-tokens: 60
    retrieval:
      # Fewer, closer chunks keep the prompt short: on a single Mac the model's prompt read is most of the wait.
      # Not yet measured with RetrievalEval; tune per environment through the variables.
      top-k: ${KNOWLEDGE_RETRIEVAL_TOP_K:4}
      min-similarity: ${KNOWLEDGE_RETRIEVAL_MIN_SIMILARITY:0.45}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat-model: ${OLLAMA_CHAT_MODEL:qwen3:8b}
      embed-model: ${OLLAMA_EMBED_MODEL:bge-m3}
      # Output size of the embed model; must equal the vector(n) column or the backend refuses to start.
      embed-dimensions: ${OLLAMA_EMBED_DIMENSIONS:1024}
      connect-timeout: 5s
      read-timeout: 180s
      # A negative value keeps the models loaded until Ollama restarts, so no question pays for a reload.
      keep-alive: ${KNOWLEDGE_OLLAMA_KEEP_ALIVE:-1s}
  assistant:
    agent:
      max-steps: ${ASSISTANT_AGENT_MAX_STEPS:4}
      history-messages: 20
      action-ttl: ${ASSISTANT_ACTION_TTL:10m}
      max-concurrent-turns: ${ASSISTANT_MAX_CONCURRENT_TURNS:4}
    budget:
      num-ctx: ${ASSISTANT_BUDGET_NUM_CTX:8192}
      system-and-tools: ${ASSISTANT_BUDGET_SYSTEM:1200}
      history: ${ASSISTANT_BUDGET_HISTORY:2000}
      retrieved: ${ASSISTANT_BUDGET_RETRIEVED:2000}
      answer: ${ASSISTANT_BUDGET_ANSWER:1000}
    limits:
      questions-per-hour: ${ASSISTANT_QUESTIONS_PER_HOUR:60}
    history:
      retention: ${ASSISTANT_HISTORY_RETENTION:90d}
    generation:
      jobs-per-day: ${ASSISTANT_GENERATION_JOBS_PER_DAY:3}
      poll-interval: ${ASSISTANT_GENERATION_POLL:3s}
      source-retention: ${ASSISTANT_GENERATION_SOURCE_RETENTION:30d}
      model-call-timeout: ${ASSISTANT_GENERATION_CALL_TIMEOUT:90s}
      # Chat attachments for Soạn cùng trợ lý: uploads per user in 24 hours, and how long one no session uses is kept.
      source-uploads-per-day: ${ASSISTANT_GENERATION_SOURCE_UPLOADS_PER_DAY:10}
      unused-source-ttl: ${ASSISTANT_GENERATION_UNUSED_SOURCE_TTL:24h}
    # Trợ lý ngoài (ADR 0004): an outside assistant drafts courses through /api/v1/mcp with a Kết nối trợ lý ngoài.
    # On by default (the production compose file on the server does not pass the variable); set it to false to
    # turn the feature off, and the endpoints then answer 404.
    external:
      enabled: ${ASSISTANT_EXTERNAL_ENABLED:true}
      # The web app the editor link of a session opens.
      app-base-url: ${ASSISTANT_EXTERNAL_APP_BASE_URL:${SCORM_LMS_ORIGIN:http://localhost:4200}}
      calls-per-minute: ${ASSISTANT_EXTERNAL_CALLS_PER_MINUTE:60}
      max-body: ${ASSISTANT_EXTERNAL_MAX_BODY:256KB}
      max-active-sessions: ${ASSISTANT_EXTERNAL_MAX_ACTIVE_SESSIONS:3}
      last-used-interval: 1m
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: 600
  chat-room:
    ticket-ttl: ${CHAT_ROOM_TICKET_TTL:20s}
    idle-timeout: ${CHAT_ROOM_IDLE_TIMEOUT:60s}
    session-check-interval: ${CHAT_ROOM_SESSION_CHECK_INTERVAL:10s}
    send-timeout: ${CHAT_ROOM_SEND_TIMEOUT:2s}
    media-ice-urls: ${CHAT_ROOM_ICE_URLS:stun:stun.l.google.com:19302}
    media-turn-username: ${CHAT_ROOM_TURN_USERNAME:}
    media-turn-credential: ${CHAT_ROOM_TURN_CREDENTIAL:}
  cors:
    origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  scorm:
    temp-dir: ${UPLOAD_TEMP_DIR:./data/uploads-tmp}/scorm
    player-port: ${SCORM_PLAYER_PORT:8020}
    player-origin: ${SCORM_PLAYER_ORIGIN:http://localhost:8020}
    lms-origin: ${SCORM_LMS_ORIGIN:http://localhost:4200}
  bootstrap:
    admin-id: ${APP_BOOTSTRAP_ADMIN_ID:}
    admin-user: ${APP_BOOTSTRAP_ADMIN_USER:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    persist-authorization: false
    disable-swagger-default-url: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method
  packages-to-scan: vn.com.coreacademy
  paths-to-match: /api/**

logging:
  config: classpath:log4j2-spring.xml
  file:
    path: ${LOG_PATH:./logs}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    vn.com.coreacademy: ${LOG_LEVEL_APP:INFO}
