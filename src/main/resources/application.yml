server:
  port: ${SERVER_PORT:8019}
  error:
    include-message: never
spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: corebanking-academy
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: 30
  cors:
    origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  bootstrap:
    admin-id: ${APP_BOOTSTRAP_ADMIN_ID:}
    admin-user: ${APP_BOOTSTRAP_ADMIN_USER:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    persist-authorization: false
    disable-swagger-default-url: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method
  packages-to-scan: vn.com.coreacademy
  paths-to-match: /api/**
