# Local-only S3 for development. Use together with compose.yaml (the `db` service):
#   docker compose -f compose.yaml -f compose.local.yaml --env-file .env.local up -d db s3 s3-init
# Steps: docs/sql/README.md, section "Chạy local".
#
# The community minio/minio and minio/mc images are no longer published, so this uses the frozen
# bitnamilegacy/minio image (it bundles `mc`). It gets no security updates: loopback ports only, never deploy it.

# Own project name so `down -v` here never touches the volume of another stack in this folder.
name: core-academy-local

services:
  s3:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    entrypoint: ["minio"]
    command: ["server", "/bitnami/minio/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER:?Set S3_ROOT_USER in .env.local}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?Set S3_ROOT_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - core_academy_s3:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/ready"]
      interval: 5s
      retries: 10

  # Runs once: creates the bucket and a user whose policy covers only that bucket, like production.
  # Safe to run again. Check with: docker compose ... run --rm s3-init "mc ls local/$S3_BUCKET"
  s3-init:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MC_HOST_local: http://${S3_ROOT_USER}:${S3_ROOT_PASSWORD}@s3:9000
      BUCKET: ${S3_BUCKET:-academy-media}
      APP_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env.local}
      APP_SECRET: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env.local}
    command:
      - |
        mc mb --ignore-existing "local/$$BUCKET"
        cat > /tmp/policy.json <<POLICY
        {"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::$$BUCKET"]},
          {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::$$BUCKET/*"]}
        ]}
        POLICY
        mc admin policy create local academy-media-backend /tmp/policy.json
        mc admin user add local "$$APP_KEY" "$$APP_SECRET" || true
        mc admin policy attach local academy-media-backend --user "$$APP_KEY" || true
        echo "bucket $$BUCKET ready"

volumes:
  core_academy_s3:
