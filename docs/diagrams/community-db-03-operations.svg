<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1375" viewBox="0 0 2400 1375"><rect width="100%" height="100%" fill="#f3f7fa"/><text x="60" y="80" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#004d4b">COMMUNITY DATABASE — THEO DÕI • THÔNG BÁO • ĐIỀU PHỐI</text><text x="60" y="125" font-family="Arial, sans-serif" font-size="24" font-weight="normal" fill="#233b4c">BẢN ĐỀ XUẤT  •  8 bảng trong nhóm / 51 bảng toàn bộ  •  Chưa tạo bảng hoặc chạy SQL</text><rect x="60" y="151" width="2280" height="100" rx="12" fill="#e1f0ee" stroke="#e1f0ee"/><text x="84" y="191" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">user 1 → N subscriptions / collections / notifications</text><text x="84" y="228" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">outbox event 1 → N notifications  •  report 1 → N moderation_actions</text><rect x="60" y="285" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="326" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">01  subscriptions</text><text x="80" y="365" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Theo dõi một nội dung/tag/Guild/tác giả</text><text x="80" y="433" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: subscription_id B PK</text><text x="80" y="470" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: user_id, content_id, tag_id, guild_id,</text><text x="80" y="499" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">author_user_id</text><text x="80" y="571" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: delivery_mode</text><rect x="828" y="285" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="848" y="326" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">02  collections</text><text x="848" y="365" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Bộ sưu tập dấu trang của người dùng</text><text x="848" y="433" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: collection_id B PK</text><text x="848" y="470" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: owner_user_id, owner_org_id, primary_guild_id,</text><text x="848" y="499" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">client_request_id</text><text x="848" y="571" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: name, description, visibility</text><rect x="1596" y="285" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="1616" y="326" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">03  collection_items</text><text x="1616" y="365" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một nội dung được lưu vào bộ sưu tập</text><text x="1616" y="433" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: item_id B PK</text><text x="1616" y="470" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: collection_id, content_id</text><text x="1616" y="571" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: note, sort_no</text><rect x="60" y="611" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="652" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">04  notifications</text><text x="80" y="691" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một thông báo in-app cho một người</text><text x="80" y="759" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: notification_id B PK</text><text x="80" y="796" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: recipient_user_id, event_id, content_id</text><text x="80" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: read_at, delivery_status, delivered_at</text><rect x="828" y="611" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="848" y="652" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">05  outbox_events</text><text x="848" y="691" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một sự kiện cần xử lý sau commit</text><text x="848" y="759" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: event_id B PK</text><text x="848" y="796" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: owner_org_id, actor_user_id, content_id, guild_id</text><text x="848" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: event_type, payload_json, dedup_key</text><rect x="1596" y="611" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="1616" y="652" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">06  reports</text><text x="1616" y="691" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một báo cáo vi phạm/sai/lỗi thời do thành viên gửi</text><text x="1616" y="759" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: report_id B PK</text><text x="1616" y="796" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: reporter_user_id, content_id, comment_id,</text><text x="1616" y="825" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">assigned_moderator_user_id</text><text x="1616" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: reason_code, description, report_status</text><rect x="60" y="937" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="978" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">07  moderation_actions</text><text x="80" y="1017" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Lịch sử hành động xử lý báo cáo</text><text x="80" y="1085" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: action_id B PK</text><text x="80" y="1122" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: report_id, actor_user_id</text><text x="80" y="1223" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: action_type, reason, previous_state_json</text><rect x="828" y="937" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="848" y="978" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">08  maintenance_reviews</text><text x="848" y="1017" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một lần rà soát tính cập nhật của nội dung</text><text x="848" y="1085" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: maintenance_review_id B PK</text><text x="848" y="1122" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: content_id, revision_id, reviewer_user_id</text><text x="848" y="1223" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: outcome, note, reviewed_at</text><text x="60" y="1311" font-family="Arial, sans-serif" font-size="24" font-weight="normal" fill="#005f58">REF = cột ID liên kết logic; KHÔNG có FOREIGN KEY/cascade vật lý. Bảng trong DB đều có prefix community_.</text><text x="60" y="1346" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">users/orgs/courses/knowledge_documents: dùng lại dữ liệu hiện có. Chi tiết cột, kiểu và quy tắc: COMMUNITY_DATABASE.md.</text></svg>