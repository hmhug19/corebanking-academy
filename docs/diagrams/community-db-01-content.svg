<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2027" viewBox="0 0 2400 2027"><rect width="100%" height="100%" fill="#f3f7fa"/><text x="60" y="80" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#004d4b">COMMUNITY DATABASE — NỘI DUNG &amp; THÀNH PHẦN DÙNG CHUNG</text><text x="60" y="125" font-family="Arial, sans-serif" font-size="24" font-weight="normal" fill="#233b4c">BẢN ĐỀ XUẤT  •  13 bảng trong nhóm / 51 bảng toàn bộ  •  Chưa tạo bảng hoặc chạy SQL</text><rect x="60" y="151" width="2280" height="100" rx="12" fill="#e1f0ee" stroke="#e1f0ee"/><text x="84" y="191" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">contents 1 → N revisions → N revision_assets ← 1 assets</text><text x="84" y="228" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">contents N ↔ N tags  •  contents 1 → N comments / votes / access_grants</text><rect x="60" y="285" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="326" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">01  contents</text><text x="80" y="365" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Định danh ổn định của một nội dung</text><text x="80" y="433" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: content_id B PK</text><text x="80" y="470" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: owner_org_id, author_user_id, maintainer_user_id,</text><text x="80" y="499" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">primary_guild_id, current_published_revision_id,</text><text x="80" y="528" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">current_draft_revision_id, client_request_id</text><text x="80" y="571" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: kind, visibility, lifecycle_status</text><rect x="828" y="285" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="848" y="326" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">02  content_revisions</text><text x="848" y="365" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một phiên bản tiêu đề/nội dung/metadata</text><text x="848" y="433" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: revision_id B PK</text><text x="848" y="470" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: content_id</text><text x="848" y="571" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: revision_no, title, body_markdown</text><rect x="1596" y="285" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="1616" y="326" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">03  content_access_grants</text><text x="1616" y="365" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Quyền đọc/sửa bổ sung của nội dung restricted</text><text x="1616" y="433" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: grant_id B PK</text><text x="1616" y="470" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: content_id, user_id, guild_id</text><text x="1616" y="571" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: permission, status, expires_at</text><rect x="60" y="611" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="652" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">04  assets</text><text x="80" y="691" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Metadata một tệp Community, không lưu bytes trong</text><text x="80" y="721" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">DB</text><text x="80" y="759" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: asset_id B PK</text><text x="80" y="796" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: owner_org_id, s3_upload_id</text><text x="80" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: uploaded_by, original_name, storage_key</text><rect x="828" y="611" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="848" y="652" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">05  asset_upload_parts</text><text x="848" y="691" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Manifest từng phần upload đã ACK/reserved, không</text><text x="848" y="721" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">lưu bytes</text><text x="848" y="759" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: part_id B PK</text><text x="848" y="796" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: asset_id</text><text x="848" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: part_number, size_bytes, checksum_sha256</text><rect x="1596" y="611" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="1616" y="652" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">06  revision_assets</text><text x="1616" y="691" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một lần dùng tệp trong đúng phiên bản</text><text x="1616" y="759" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: revision_asset_id B PK</text><text x="1616" y="796" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: revision_id, asset_id</text><text x="1616" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: usage, caption, alt_text</text><rect x="60" y="937" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="978" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">07  tags</text><text x="80" y="1017" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một chủ đề tìm kiếm/theo dõi</text><text x="80" y="1085" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: tag_id B PK</text><text x="80" y="1122" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: owner_org_id, merged_into_tag_id</text><text x="80" y="1223" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: slug, name, description</text><rect x="828" y="937" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="848" y="978" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">08  tag_aliases</text><text x="848" y="1017" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Tên đồng nghĩa để tìm tag, như Spring</text><text x="848" y="1047" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Boot/SpringBoot</text><text x="848" y="1085" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: alias_id B PK</text><text x="848" y="1122" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: tag_id</text><text x="848" y="1223" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: normalized_alias</text><rect x="1596" y="937" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="1616" y="978" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">09  content_tags</text><text x="1616" y="1017" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một tag gắn với nội dung ổn định</text><text x="1616" y="1085" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: content_tag_id B PK</text><text x="1616" y="1122" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: content_id, tag_id</text><text x="1616" y="1223" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Metadata chung và nội dung: xem tài liệu</text><rect x="60" y="1263" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="1304" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">10  comments</text><text x="80" y="1343" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một bình luận hoặc phản hồi bình luận</text><text x="80" y="1411" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: comment_id B PK</text><text x="80" y="1448" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: content_id, author_user_id, parent_comment_id,</text><text x="80" y="1477" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">revision_id, review_thread_id, client_request_id</text><text x="80" y="1549" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: body_markdown, status, request_hash</text><rect x="828" y="1263" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="848" y="1304" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">11  votes</text><text x="848" y="1343" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Trạng thái vote hiện tại của một người cho một nội</text><text x="848" y="1373" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">dung</text><text x="848" y="1411" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: vote_id B PK</text><text x="848" y="1448" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: content_id, user_id</text><text x="848" y="1549" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: value</text><rect x="1596" y="1263" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="1616" y="1304" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">12  content_links</text><text x="1616" y="1343" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Liên kết tri thức tới nội dung, khóa học hoặc tài</text><text x="1616" y="1373" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">liệu AI hiện có</text><text x="1616" y="1411" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: link_id B PK</text><text x="1616" y="1448" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: source_content_id, target_content_id,</text><text x="1616" y="1477" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">target_course_id, target_knowledge_document_id</text><text x="1616" y="1549" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: relation_type</text><rect x="60" y="1589" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="1630" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">13  revision_approvals</text><text x="80" y="1669" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một quyết định duyệt bản tài liệu cụ thể</text><text x="80" y="1737" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: approval_id B PK</text><text x="80" y="1774" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: revision_id, reviewer_user_id</text><text x="80" y="1875" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: decision, note, decided_at</text><text x="60" y="1963" font-family="Arial, sans-serif" font-size="24" font-weight="normal" fill="#005f58">REF = cột ID liên kết logic; KHÔNG có FOREIGN KEY/cascade vật lý. Bảng trong DB đều có prefix community_.</text><text x="60" y="1998" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">users/orgs/courses/knowledge_documents: dùng lại dữ liệu hiện có. Chi tiết cột, kiểu và quy tắc: COMMUNITY_DATABASE.md.</text></svg>