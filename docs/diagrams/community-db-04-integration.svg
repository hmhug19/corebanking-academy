<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2353" viewBox="0 0 2400 2353"><rect width="100%" height="100%" fill="#f3f7fa"/><text x="60" y="80" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#004d4b">COMMUNITY DATABASE — ĐÓNG GÓP • DIGEST • LEARNING • AI</text><text x="60" y="125" font-family="Arial, sans-serif" font-size="24" font-weight="normal" fill="#233b4c">BẢN ĐỀ XUẤT  •  16 bảng trong nhóm / 51 bảng toàn bộ  •  Chưa tạo bảng hoặc chạy SQL</text><rect x="60" y="151" width="2280" height="100" rx="12" fill="#e1f0ee" stroke="#e1f0ee"/><text x="84" y="191" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">user 1 → N contribution_events / awards / digests / AI turns</text><text x="84" y="228" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">revision 1 → N search_chunks → N AI turn_sources  •  collection 1 → N grants</text><rect x="60" y="285" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="326" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">01  collection_access_grants</text><text x="80" y="365" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một quyền đọc/cộng tác bộ sưu tập restricted</text><text x="80" y="433" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: grant_id B PK</text><text x="80" y="470" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: collection_id, user_id, guild_id</text><text x="80" y="571" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: permission, expires_at, status</text><rect x="828" y="285" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="848" y="326" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">02  knowledge_requests</text><text x="848" y="365" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Trạng thái xử lý một yêu cầu bổ sung tri thức</text><text x="848" y="433" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: content_id B PK</text><text x="848" y="470" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: —</text><text x="848" y="571" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: request_status, claimed_by, claimed_at</text><rect x="1596" y="285" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="1616" y="326" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">03  user_preferences</text><text x="1616" y="365" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Onboarding và lịch nhận bản tin của một người</text><text x="1616" y="433" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: user_id U PK</text><text x="1616" y="470" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: —</text><text x="1616" y="571" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: onboarding_completed_at, time_zone,…</text><rect x="60" y="611" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="652" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">04  notification_digest_batches</text><text x="80" y="691" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một kỳ bản tin in-app có retry và lease</text><text x="80" y="759" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: batch_id B PK</text><text x="80" y="796" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: user_id</text><text x="80" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: window_start, window_end, batch_status</text><rect x="828" y="611" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="848" y="652" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">05  notification_digest_items</text><text x="848" y="691" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một notification nằm trong đúng một kỳ bản tin</text><text x="848" y="759" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: item_id B PK</text><text x="848" y="796" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: batch_id, notification_id</text><text x="848" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Metadata chung và nội dung: xem tài liệu</text><rect x="1596" y="611" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="1616" y="652" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">06  contribution_events</text><text x="1616" y="691" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một bút toán điểm đóng góp bất biến hoặc đảo điểm</text><text x="1616" y="759" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: contribution_event_id B PK</text><text x="1616" y="796" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: org_id, user_id, content_id, source_event_id,</text><text x="1616" y="825" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">reverses_event_id</text><text x="1616" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: reason_code, points_delta, policy_version</text><rect x="60" y="937" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="978" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">07  badges</text><text x="80" y="1017" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một phiên bản quy tắc huy hiệu trong đơn vị</text><text x="80" y="1085" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: badge_id B PK</text><text x="80" y="1122" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: owner_org_id</text><text x="80" y="1223" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: code, name, description</text><rect x="828" y="937" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="848" y="978" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">08  badge_awards</text><text x="848" y="1017" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Quyết định trao/thu hồi huy hiệu theo đúng phiên</text><text x="848" y="1047" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">bản luật</text><text x="848" y="1085" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: award_id B PK</text><text x="848" y="1122" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: badge_id, user_id, source_event_id</text><text x="848" y="1223" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: status, awarded_at, revoked_at</text><rect x="1596" y="937" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="1616" y="978" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">09  learning_links</text><text x="1616" y="1017" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một tài liệu Community được ghim vào phiên bản khóa</text><text x="1616" y="1047" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">học</text><text x="1616" y="1085" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: learning_link_id B PK</text><text x="1616" y="1122" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: course_revision_id, lesson_id,</text><text x="1616" y="1151" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">content_revision_id</text><text x="1616" y="1223" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: sort_no, status</text><rect x="60" y="1263" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="1304" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">10  content_views</text><text x="80" y="1343" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một lượt đọc duy nhất theo người/ngày phục vụ thống</text><text x="80" y="1373" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">kê</text><text x="80" y="1411" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: view_id B PK</text><text x="80" y="1448" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: content_id, user_id</text><text x="80" y="1549" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: view_date, first_view_at, last_view_at</text><rect x="828" y="1263" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="848" y="1304" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">11  search_chunks</text><text x="848" y="1343" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một đoạn index của revision để search/RAG có ACL</text><text x="848" y="1411" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: chunk_id B PK</text><text x="848" y="1448" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: content_id, revision_id, transcript_id</text><text x="848" y="1549" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: chunk_no, body_text, embedding</text><rect x="1596" y="1263" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="1616" y="1304" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">12  media_transcripts</text><text x="1616" y="1343" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một phiên bản bản chép lời của video, được biên tập</text><text x="1616" y="1373" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">trước publish</text><text x="1616" y="1411" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: transcript_id B PK</text><text x="1616" y="1448" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: asset_id, client_request_id</text><text x="1616" y="1549" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: version_no, language, body_text</text><rect x="60" y="1589" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="1630" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">13  ai_turns</text><text x="80" y="1669" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Metadata một lượt AI để retry/feedback, không lưu</text><text x="80" y="1699" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">prompt/answer</text><text x="80" y="1737" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: turn_id B PK</text><text x="80" y="1774" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: user_id, request_id</text><text x="80" y="1875" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: request_hash, model, turn_status</text><rect x="828" y="1589" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="848" y="1630" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">14  ai_turn_sources</text><text x="848" y="1669" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Nguồn chính xác của một lượt AI, kiểm quyền lại khi</text><text x="848" y="1699" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">xem</text><text x="848" y="1737" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: source_id B PK</text><text x="848" y="1774" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: turn_id, community_chunk_id, knowledge_chunk_id,</text><text x="848" y="1803" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">course_revision_id</text><text x="848" y="1875" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: citation_no, used_in_answer</text><rect x="1596" y="1589" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="1616" y="1630" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">15  ai_feedback</text><text x="1616" y="1669" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Phản hồi của chủ lượt AI, không lưu lại câu trả lời</text><text x="1616" y="1699" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">riêng tư</text><text x="1616" y="1737" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: feedback_id B PK</text><text x="1616" y="1774" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: turn_id, user_id</text><text x="1616" y="1875" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: helpful, reason_code, note</text><rect x="60" y="1915" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="1956" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">16  mentions</text><text x="80" y="1995" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một người được nhắc tên trong revision hoặc bình</text><text x="80" y="2025" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">luận</text><text x="80" y="2063" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: mention_id B PK</text><text x="80" y="2100" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: mentioned_user_id, revision_id, comment_id</text><text x="80" y="2201" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Metadata chung và nội dung: xem tài liệu</text><text x="60" y="2289" font-family="Arial, sans-serif" font-size="24" font-weight="normal" fill="#005f58">REF = cột ID liên kết logic; KHÔNG có FOREIGN KEY/cascade vật lý. Bảng trong DB đều có prefix community_.</text><text x="60" y="2324" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">users/orgs/courses/knowledge_documents: dùng lại dữ liệu hiện có. Chi tiết cột, kiểu và quy tắc: COMMUNITY_DATABASE.md.</text></svg>