="#5e707b">Khác: status, granted_by, granted_at</text><rect x="828" y="611" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="848" y="652" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">05  questions</text><text x="848" y="691" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Thuộc tính riêng của một câu hỏi</text><text x="848" y="759" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: content_id B PK</text><text x="848" y="796" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: accepted_answer_content_id,</text><text x="848" y="825" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">accepted_answer_revision_id</text><text x="848" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: accepted_by, accepted_at, resolution_status</text><rect x="1596" y="611" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="1616" y="652" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">06  answers</text><text x="1616" y="691" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Một câu trả lời thuộc đúng một câu hỏi</text><text x="1616" y="759" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: content_id B PK</text><text x="1616" y="796" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: question_content_id</text><text x="1616" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Metadata chung và nội dung: xem tài liệu</text><rect x="60" y="937" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="80" y="978" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">07  question_links</text><text x="80" y="1017" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Quan hệ câu hỏi trùng/tương tự</text><text x="80" y="1085" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: question_link_id B PK</text><text x="80" y="1122" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: source_question_id, target_question_id</text><text x="80" y="1223" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: relation_type, reason</text><rect x="828" y="937" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="848" y="978" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">08  help_requests</text><text x="848" y="1017" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Mời người hoặc Guild hỗ trợ câu hỏi</text><text x="848" y="1085" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: help_request_id B PK</text><text x="848" y="1122" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">REF: question_content_id, target_user_id,</text><text x="848" y="1151" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">target_guild_id</text><text x="848" y="1223" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#5e707b">Khác: requested_by, status, due_at</text><rect x="1596" y="937" width="742" height="300" rx="12" fill="#ffffff" stroke="#ccdbe3"/><text x="1616" y="978" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005f58">09  wiki_pages</text><text x="1616" y="1017" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#233b4c">Vị trí trang Wiki và trách nhiệm duy trì</text><text x="1616" y="1085" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#8b4b05">PK: content_id B PK</text><text x="1616" 